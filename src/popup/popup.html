<html>
  <head>
    <title>CV alert box</title>
    <link rel="stylesheet" href="../shared.css" />
  </head>

  <body class="kp-card kp-card--popup">
    <!-- Logo in the prompt to fill empty space. Chrome has issues with re-shrinking poputs (mine needs to be big for scoreWheel) -->
    <div id="logoIcon2" style="display: block;">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" class="size-6">
        <defs>
          <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#4F58FD" />
            <stop offset="99%" stop-color="#149BF3" />
          </linearGradient>
        </defs>
        <path stroke="url(#logoGradient)" stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25ZM6.75 12h.008v.008H6.75V12Zm0 3h.008v.008H6.75V15Zm0 3h.008v.008H6.75V18Z" />
      </svg>
    </div>
    <div id="header" style="display: block;">
      <h1>Shortlisted</h1>
    </div>

    <div id="resume" style="display: block;">
      <h2>Want to change resume?</h2>
      <button id="resumeBtn" class="kp-button">Edit details</button>
    </div>

    <div id="scanner" style="display: block;">
      <h2>On a job post?</h2>
      <button id="scanBtn" class="kp-button">Scan page</button>
    </div>

    <div id="scoreWheel" style="display: none;">
      <h1>Match</h1>
      <div id="scoreWheelContainer" style="display: none;"></div>
    </div>

    <div id="output2" style="display: none;"></div>

    <button id="backBtn" class="kp-button" style="display: none;">Return</button>

    <script type="module" src="popup.js"></script>
  </body>
</html>
